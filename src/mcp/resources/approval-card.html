<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval</title>
<style>
  /* The card's own colors, light or dark: the host's theme (data-theme) decides, and the device's setting until the
     host names one. color-scheme goes with them, so a host color sent as light-dark() takes the same side. */
  :root { color-scheme: light; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --accent: #0b57d0; --ok: #1a7f37; --stop: #9a6700; --rule: rgba(31, 35, 40, .18); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #1f1f1e; --fg: #e6edf3; --muted: #9198a1; --accent: #6ea8fe; --ok: #3fb950; --stop: #d29922; --rule: rgba(230, 237, 243, .2); }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1f1f1e; --fg: #e6edf3; --muted: #9198a1; --accent: #6ea8fe; --ok: #3fb950; --stop: #d29922; --rule: rgba(230, 237, 243, .2); }
  /* The card paints its own surface, from the same source as its text: the host's colors, or else these. */
  body { margin: 0; padding: 14px 16px; background: var(--color-background-primary, var(--bg)); color: var(--color-text-primary, var(--fg));
    font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); font-size: var(--font-text-md-size, 15px); line-height: 1.45; }
  /* Until the host has said how it is drawn, the card paints no surface: on a device set to light, inside an app drawn
     dark, it would flash white first. A host that does not say gets the card's own surface after a moment. */
  :root:not([data-settled]) body { background: transparent; }
  #site { margin: 0 0 6px; color: var(--color-text-secondary, var(--muted)); font-size: var(--font-text-sm-size, 13px); font-weight: 600; }
  #statement { margin: 0 0 12px; padding: 0 0 0 12px; border-left: 3px solid var(--rule); }
  button { font: inherit; font-weight: var(--font-weight-semibold, 600); min-height: 44px; padding: 8px 16px; border: 0; cursor: pointer;
    border-radius: var(--border-radius-md, 8px); background: var(--color-background-inverse, var(--accent)); color: var(--color-text-inverse, var(--bg)); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.secondary { background: transparent; color: var(--color-text-primary, var(--fg)); border: 1px solid var(--rule); margin-left: 8px; }
  #phone-code { margin: 12px 0 0; }
  #qr svg { display: block; width: 180px; height: 180px; border-radius: 6px; }
  #phone-code figcaption { margin-top: 6px; font-size: var(--font-text-sm-size, 13px); color: var(--color-text-secondary, var(--muted)); }
  #status { margin: 10px 0 0; color: var(--color-text-secondary, var(--muted)); font-size: var(--font-text-sm-size, 13px); }
  body[data-status="completed"] #status { color: var(--ok); font-weight: 600; }
  body[data-status="cancelled"] #status, body[data-status="expired"] #status, body[data-status="invalidated"] #status,
  body[data-status="denied"] #status, body[data-status="rejected"] #status, body[data-status="integrity_error"] #status { color: var(--stop); }
</style>
</head>
<body>
  <p id="site">Approval</p>
  <p id="statement" hidden></p>
  <button id="open" type="button" hidden>Review and approve</button><button id="phone-show" type="button" class="secondary" hidden>Approve on your phone</button>
  <figure id="phone-code" hidden><div id="qr"></div><figcaption>Scan with your phone’s camera, then approve with your passkey (Face ID or fingerprint). The code works once and expires in two minutes.</figcaption></figure>
  <p id="status" role="status" aria-live="polite">Waiting for the request…</p>
<script type="application/json" id="card-application">{}</script>
<script>
  // MCP Apps (io.modelcontextprotocol/ui, 2026-01-26): JSON-RPC 2.0 with the host over postMessage.
  // The passkey ceremony never runs in this card. The button opens the application's own review
  // page, and the status shown is only what the application recorded, read through its status tool.
  const $ = (id) => document.getElementById(id);
  const site = $('site'), statement = $('statement'), open = $('open'), status = $('status');
  const phoneShow = $('phone-show'), phoneCode = $('phone-code'), qr = $('qr');
  // What the site recorded, by status.
  const TEXT = {
    pending: 'Waiting for approval on the site. Nothing has changed yet.',
    completed: 'Approved with a passkey. The site recorded the change.',
    completedDirect: 'Done without a passkey: the site’s rule did not require one. The site recorded the change.',
    cancelled: 'Cancelled on the site. Nothing changed.',
    expired: 'This request expired. Nothing changed.',
    // In the review page's words: the reason the site recorded is shown there, and the card does not guess at it.
    invalidated: 'This request can no longer be approved: something it depends on changed after it was made. Nothing changed.',
    denied: 'This request is no longer allowed. Nothing changed.',
    rejected: 'The site refused this request. Nothing changed.',
    integrity_error: 'The stored approval record is inconsistent, so this card cannot confirm what happened. Ask the site administrator to check the signed evidence before trying again.',
    // The host stopped the tool call: the site may have received it, so this card cannot know the outcome.
    interrupted: 'This request was stopped before the site’s answer arrived, so this card can’t tell whether anything changed. Check the site before trying again.',
  };
  // The statuses with a line above, other than pending and completed: a status from anywhere else is shown as it is.
  const STOPPED = ['cancelled', 'expired', 'invalidated', 'denied', 'rejected', 'integrity_error'];
  // The card's own lines. None of them says what the site recorded.
  const NOTE = {
    waiting: 'Waiting for the request…',
    stalled: 'This app did not start the card. Use the review link in the reply.',
    // Without the status tool the card would only repeat what was true when it was drawn, so it says it cannot follow.
    unwatched: 'Approval is needed on the site. This card can’t check the result in this app, so ask for the status after you approve.',
    stopped: 'This card has stopped checking. Ask for the status to see what the site recorded.',
    link: 'Use the review link in the reply.',
    unopened: 'The page did not open. Use the review link in the reply.',
    maybeOpened: 'If the page did not open, use the review link in the reply.',
    elsewhere: 'This result names a page on another site, so this card does not show it.',
  };
  const POLL_LIMIT_MS = 15 * 60 * 1000;
  const REQUEST_TIMEOUT_MS = 15000;
  const SETTLE_MS = 300;
  const UNANSWERED = new Error('The host did not answer.');
  let nextId = 1, view = null, timer = null, since = 0, host = {}, hostInfo = {}, capabilities = {}, codeTimer = null, ended = false, generation = 0, polling = false, shown = false, hint = null, announced = 0;
  const waiting = new Map();
  // A host may also announce the card's own calls, as the specification's diagram draws: a tool-input with a call's
  // arguments, then that call's tool-result. The card leaves both alone, since the call's reply brings its result.
  // So a tool-input with the arguments of a call the card made for the current view announces that call, however
  // often the host sends it, and each announcement is owed one tool-result. A new request forgets the calls and what
  // is owed, so an announced call whose result never came cannot take a later result for itself.
  const called = new Set();
  function callTool(name, args) {
    called.add(JSON.stringify(args));
    return request('tools/call', { name, arguments: args });
  }
  // Whether a tool-input announces one of the card's own calls, which is then owed one tool-result.
  function announces(args) {
    if (!called.has(JSON.stringify(args ?? null))) return false;
    announced++;
    return true;
  }
  function forget() { called.clear(); announced = 0; }
  // The request a tool result names, if it names one.
  function named(result) {
    const data = result && result.structuredContent;
    return (data && data.approval && data.approval.requestId) || (data && data.requestId) || null;
  }

  // Every request has a deadline except the first, which passes 0: a host that answers late still starts the card.
  function request(method, params, bound = true, limit = REQUEST_TIMEOUT_MS) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timeout = limit ? setTimeout(() => { waiting.delete(id); reject(UNANSWERED); }, limit) : null;
      waiting.set(id, { resolve, reject, timeout, bound });
      parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  function current(run) { return run === generation && !ended && view && view.status === 'pending'; }
  // The card learns the outcome only from the site's status tool, and only where the host lets it call server tools.
  function watching() { return !ended && view && view.status === 'pending' && view.statusTool && capabilities.serverTools; }
  // Retire both timers and already-sent requests. Their replies cannot revive a finished or replaced view.
  function retire() {
    generation++;
    stopPolling();
    polling = false;
    hint = null;
    hideCode();
    phoneShow.disabled = false;
    for (const [id, reply] of waiting) {
      if (!reply.bound) continue;
      waiting.delete(id);
      clearTimeout(reply.timeout);
      reply.reject(new Error('The approval view changed.'));
    }
  }
  function notify(method, params) { parent.postMessage({ jsonrpc: '2.0', method, params }, '*'); }
  function resize() { notify('ui/notifications/size-changed', { height: document.documentElement.scrollHeight }); }
  // The host sizes the frame from these reports, so the card also reports what it did not draw itself: a change of
  // the host's fonts, or of the frame's width, that wraps its lines differently.
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => resize()).observe(document.body);
  // The given colors painted one over the other, as one sRGB pixel. A canvas has the browser parse and blend them,
  // whatever their CSS notation, and a color it cannot take paints nothing.
  let pixel = null;
  function paint(...colors) {
    pixel = pixel || document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    pixel.clearRect(0, 0, 1, 1);
    for (const color of colors) { pixel.fillStyle = 'transparent'; pixel.fillStyle = color; pixel.fillRect(0, 0, 1, 1); }
    return pixel.getImageData(0, 0, 1, 1).data;
  }
  // WCAG relative luminance of an sRGB pixel, from 0 (black) to 1 (white).
  function luminance([red, green, blue]) {
    const [r, g, b] = [red, green, blue].map((byte) => byte / 255).map((c) => c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
    return .2126 * r + .7152 * g + .0722 * b;
  }
  // Whether the card's text can be read on the surface the card paints: the surface is opaque, the two contrast
  // enough for body text (WCAG AA, 4.5 to 1), and the text is the lighter of them only in a dark theme. A browser
  // that will not say counts as no.
  function legible() {
    try {
      const { color, backgroundColor } = getComputedStyle(document.body);
      const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
      const surface = paint(backgroundColor), back = luminance(surface), text = luminance(paint(backgroundColor, color));
      const contrast = (Math.max(text, back) + .05) / (Math.min(text, back) + .05);
      return surface[3] === 255 && contrast >= 4.5 && (text > back) === dark;
    } catch { return false; }
  }
  // The host's theme picks the card's colors, and the side of any light-dark() color the host sent. The card takes
  // the specification's style variables, so none can replace one of its own. It uses the host's colors only as a
  // pair, the host's text on the host's surface, and only where that is legible in the theme. A host can name one
  // theme and send the other's colors, or colors this browser cannot use: then the card's own apply. The host's
  // fonts, sizes and radii apply either way.
  const hostVariables = new Map();
  function settle() { document.documentElement.dataset.settled = ''; }
  function applyTheme(context) {
    if (!context) return;
    settle();
    host = { ...host, ...context };
    const root = document.documentElement;
    if (context.theme === 'light' || context.theme === 'dark') root.dataset.theme = context.theme;
    for (const [key, value] of Object.entries((context.styles && context.styles.variables) || {})) {
      const name = key.startsWith('--') ? key : '--' + key;
      if (typeof value === 'string' && /^--(color|font|border|shadow)-/.test(name)) hostVariables.set(name, value);
    }
    // Every color the host has sent is tried again: a change of theme alone can make them fit, or stop them fitting.
    for (const [name, value] of hostVariables) root.style.setProperty(name, value);
    const paired = hostVariables.has('--color-text-primary') && hostVariables.has('--color-background-primary');
    if (!(paired && legible())) for (const name of hostVariables.keys()) if (name.startsWith('--color-')) root.style.removeProperty(name);
  }
  function secure(url) { return url.protocol === 'https:' || (url.protocol === 'http:' && url.hostname === 'localhost'); }
  // The application this card belongs to, as its server wrote it in (ApprovalCard::html()). The card opens pages on
  // that origin only and calls only those tools, whatever a result names; written nothing, it opens and calls nothing.
  const APPLICATION = (() => {
    try {
      const written = JSON.parse($('card-application').textContent), origin = new URL(written.origin);
      const tool = (name) => typeof name === 'string' && name !== '' ? name : null;
      return { origin: secure(origin) ? origin.origin : null, statusTool: tool(written.statusTool), handoffTool: tool(written.handoffTool) };
    } catch { return { origin: null, statusTool: null, handoffTool: null }; }
  })();
  function reviewUrl(value) {
    try {
      const url = new URL(value);
      return secure(url) && url.origin === APPLICATION.origin ? url : null;
    } catch { return null; }
  }
  // The review link a result names, wherever it points. Older results without the card's view name it at the top.
  function link(result) {
    const data = (result && result.structuredContent) || {};
    return (data.approval && data.approval.reviewUrl) || data.reviewUrl || data.review_url || null;
  }
  // Whether a link would send the person to a page that is not on this application's origin.
  function elsewhere(value) { return value !== null && !reviewUrl(value); }
  // Reads the card's fixed view, or the request an older result names. A result that links to another site is not
  // shown at all. It can leave out a tool the site has, and cannot name one the site does not.
  function read(result) {
    const data = (result && result.structuredContent) || {};
    const card = data.approval || {};
    const found = {
      requestId: card.requestId || data.requestId, status: card.status || data.status, reason: card.reason ?? data.reason ?? null,
      approvedWithPasskey: typeof card.approvedWithPasskey === 'boolean' ? card.approvedWithPasskey : null,
      completedAt: typeof card.completedAt === 'string' ? card.completedAt : null, earlier: card.earlier === true,
      reviewUrl: link(result), statement: card.statement || null,
      statusTool: APPLICATION.statusTool && card.statusTool === APPLICATION.statusTool ? APPLICATION.statusTool : null,
      handoffTool: APPLICATION.handoffTool && card.handoffTool === APPLICATION.handoffTool ? APPLICATION.handoffTool : null,
    };
    return found.requestId && found.status && !elsewhere(found.reviewUrl) ? found : null;
  }
  function render() {
    if (!view) {
      site.textContent = 'Approval'; open.hidden = true; phoneShow.hidden = true; statement.hidden = true;
      // An earlier request's color does not carry over to the next one.
      delete document.body.dataset.status;
      status.textContent = 'No approval is waiting.'; resize(); return;
    }
    const url = reviewUrl(view.reviewUrl);
    const pending = view.status === 'pending';
    site.textContent = pending ? 'Approval needed on ' + (url ? url.host : 'the site')
      : view.earlier ? 'Earlier request on ' + (url ? url.host : 'the site') : (url ? url.host : 'Approval');
    if (view.statement) { statement.textContent = '“' + view.statement + '”'; statement.hidden = false; }
    open.hidden = !(pending && url && capabilities.openLinks);
    // A phone needs the site on HTTPS, and a host that is already a phone doesn't need a code.
    phoneShow.hidden = !(pending && url && url.protocol === 'https:' && view.handoffTool && capabilities.serverTools && platform() !== 'mobile');
    if (!pending) hideCode();
    document.body.dataset.status = view.status;
    status.textContent = view.status === 'completed' ? completedLine()
      : pending ? hint || (watching() ? TEXT.pending : NOTE.unwatched) + (open.hidden ? ' ' + NOTE.link : '')
      : STOPPED.includes(view.status) ? TEXT[view.status] : 'Status: ' + view.status + '.';
    if (!pending) stopPolling();
    resize();
  }
  // Only the site's record of a passkey proof makes a completed request one a person approved. A request key can
  // name a request that finished before this tool call; then nothing ran now, and the card says when it did.
  function completedLine() {
    if (view.earlier) {
      const at = localTime(view.completedAt);
      return 'Completed earlier' + (at ? ', on ' + at : '') + '. Nothing ran now.';
    }
    return view.approvedWithPasskey === true ? TEXT.completed : view.approvedWithPasskey === false ? TEXT.completedDirect : 'Completed. The site recorded the change.';
  }
  // A time the site recorded, in this device's time zone, or null when it cannot be read.
  function localTime(value) {
    try {
      const time = new Date(value);
      return typeof value === 'string' && !Number.isNaN(time.getTime()) ? time.toLocaleString('en', { dateStyle: 'medium', timeStyle: 'short' }) : null;
    } catch { return null; }
  }
  // A line about the person's last step. It stays, through status checks that find the request still
  // pending, until they take another step or the site records an outcome.
  function say(text) { hint = text; render(); }
  // Polls the status tool quickly while the person is likely approving, then backs off, and not at all
  // while the card is hidden. A quarter of an hour after the result arrived or the person last used a
  // button, it stops and says so. The site is the only source of the outcome.
  function pollDelay() {
    const elapsed = Date.now() - since;
    return elapsed < 2 * 60 * 1000 ? 3000 : elapsed < 5 * 60 * 1000 ? 10000 : 30000;
  }
  function stopPolling() { if (timer) { clearTimeout(timer); timer = null; } }
  function schedulePoll() {
    stopPolling();
    if (polling || !watching()) return;
    if (Date.now() - since > POLL_LIMIT_MS) { status.textContent = NOTE.stopped; resize(); return; }
    timer = setTimeout(poll, pollDelay());
  }
  async function poll() {
    timer = null;
    const run = generation;
    if (polling || !watching()) return;
    if (document.hidden) { schedulePoll(); return; }
    polling = true;
    const result = await callTool(view.statusTool, { request_id: view.requestId }).catch(() => null);
    if (!current(run)) return;
    polling = false;
    const next = result && (!result.isError || result.structuredContent?.status === 'integrity_error') ? read(result) : null;
    if (next && next.requestId === view.requestId) {
      if (next.status !== 'pending') retire();
      view = { ...view, status: next.status, reason: next.reason, approvedWithPasskey: next.approvedWithPasskey, completedAt: next.completedAt };
      render();
    } else {
      status.textContent = 'This card can’t confirm the current status. Check the site before trying again.';
      resize();
    }
    schedulePoll();
  }
  // Coming back into view is when the person has most likely just approved, so the card checks at once, also after it stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { stopPolling(); poll(); } });
  // The host's platform as it says, or a guess: Claude's desktop app is built on Electron.
  function platform() { return host.platform || (/Electron\//.test(navigator.userAgent) ? 'desktop' : 'web'); }
  // Tells the review page where the person came from, so it can offer the way back after approval. Only a host that
  // names itself Claude in its answer to ui/initialize is sent back by Claude's own links; any other gets the page's
  // own line, which names the agent as the site calls it.
  function returnTarget() {
    const claude = [hostInfo.name, host.userAgent].some((name) => typeof name === 'string' && /claude/i.test(name));
    const where = platform();
    return !claude ? 'agent' : where === 'desktop' || where === 'mobile' ? 'claude-' + where : 'claude-web';
  }
  function show(result) {
    if (ended) return;
    shown = true;
    forget();
    retire();
    view = read(result);
    since = Date.now();
    render();
    // An error result can name no request: a refusal is still shown as one, and a damaged record as unconfirmed.
    const failure = view ? null : result?.structuredContent?.status;
    if (failure === 'rejected' || failure === 'integrity_error') { document.body.dataset.status = failure; status.textContent = TEXT[failure]; resize(); }
    else if (!view && elsewhere(link(result))) { status.textContent = NOTE.elsewhere; resize(); }
    schedulePoll();
  }
  // The host ends this card: the tool call was cancelled, or the view is being torn down.
  function end(text) {
    ended = true;
    retire();
    open.hidden = true;
    phoneShow.hidden = true;
    if (text && (!view || view.status === 'pending')) { status.textContent = text; resize(); }
  }

  addEventListener('message', (event) => {
    if (event.source !== parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id !== undefined && waiting.has(message.id) && ('result' in message || 'error' in message)) {

      waiting.delete(message.id);
      clearTimeout(reply.timeout);
      'error' in message ? reply.reject(message.error) : reply.resolve(message.result);
      return;
    }
    if (message.method === 'ui/notifications/tool-input' && !ended) {
      if (announces(message.params && message.params.arguments)) return;
      forget(); retire(); view = null; render(); status.textContent = NOTE.waiting;
    }
    if (message.method === 'ui/notifications/tool-result') {
      // An announced call's result names this request, or none when the site refused the call. Any other is drawn.
      if (announced > 0 && [null, view && view.requestId].includes(named(message.params))) announced--;
      else show(message.params);
    }
    if (message.method === 'ui/notifications/host-context-changed') applyTheme(message.params);
    if (message.method === 'ui/notifications/tool-cancelled') {
      const reason = message.params && typeof message.params.reason === 'string' ? ' ' + message.params.reason : '';
      end(TEXT.interrupted + reason);
    }
    // A request from the host gets an answer: teardown and ping succeed, and this card implements nothing else.
    if (message.id === undefined || typeof message.method !== 'string' || message.method.includes('notifications/')) return;
    if (message.method === 'ui/resource-teardown') end(null);
    const answer = message.method === 'ui/resource-teardown' || message.method === 'ping' ? { result: {} } : { error: { code: -32601, message: 'Method not found' } };
    parent.postMessage({ jsonrpc: '2.0', id: message.id, ...answer }, '*');
  });
  // Using a button shows the person is here, so the card checks quickly again and for another quarter of an hour.
  function restartPolling() { since = Date.now(); schedulePoll(); }
  open.addEventListener('click', async () => {
    const run = generation;
    const url = view && reviewUrl(view.reviewUrl);
    if (!current(run) || !url || !capabilities.openLinks) return;
    url.hash = 'return=' + returnTarget();
    restartPolling();
    const opened = await request('ui/open-link', { url: url.href }).catch((error) => ({ isError: true, unanswered: error === UNANSWERED }));
    if (!current(run)) return;
    // A host may wait for the person to confirm the link, so no answer in time is not a refusal.
    say(opened && opened.unanswered ? NOTE.maybeOpened
      : opened && opened.isError ? NOTE.unopened
      : watching() ? 'Approve on the site with your passkey. This card updates when the site records the result.' : null);
  });
  // Draws the code from the server's rows of 0 and 1 (quiet zone included), so no markup is parsed.
  function drawCode(rows) {
    const size = Array.isArray(rows) ? rows.length : 0;
    if (size < 21 || size > 200 || rows.some((row) => typeof row !== 'string' || row.length !== size || /[^01]/.test(row))) return null;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('shape-rendering', 'crispEdges');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'QR code that opens this approval on your phone');
    const back = document.createElementNS(NS, 'rect');
    back.setAttribute('width', size);
    back.setAttribute('height', size);
    back.setAttribute('fill', '#fff');
    let path = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < size; x++) {
        if (row[x] !== '1') continue;
        let run = 1;
        while (row[x + run] === '1') run++;
        path += 'M' + x + ' ' + y + 'h' + run + 'v1h-' + run + 'z';
        x += run - 1;
      }
    });

    dark.setAttribute('d', path);
    dark.setAttribute('fill', '#000');
    svg.append(back, dark);
    return svg;
  }
  function hideCode() {
    if (codeTimer) { clearTimeout(codeTimer); codeTimer = null; }
    phoneCode.hidden = true;
    qr.replaceChildren();
  }
  phoneShow.addEventListener('click', async () => {
    const run = generation;
    if (!current(run) || phoneShow.disabled || !view.handoffTool || !capabilities.serverTools) return;
    phoneShow.disabled = true;
    restartPolling();
    const result = await callTool(view.handoffTool, { request_id: view.requestId }).catch(() => null);
    if (!current(run)) return;
    if (result?.structuredContent?.status === 'integrity_error') {
      retire();
      view = { ...view, status: 'integrity_error' };
      render();
      return;
    }
    const data = result && !result.isError && result.structuredContent;
    const code = data && data.requestId === view.requestId ? drawCode(data.modules) : null;
    phoneShow.disabled = false;
    if (!code) { say('The phone code could not be made. ' + (open.hidden ? NOTE.link : 'Approve on this device instead.')); return; }
    hideCode();
    qr.replaceChildren(code);
    phoneCode.hidden = false;
    phoneShow.textContent = 'Show a new code';
    say(watching() ? 'Waiting for your approval on your phone. Nothing has changed yet.' : null);
    const seconds = Number(data.expiresIn) > 0 ? Math.min(Number(data.expiresIn), 600) : 120;
    codeTimer = setTimeout(() => {
      if (!current(run)) return;
      hideCode();
      say('That code expired. Show a new code to try again.');
    }, seconds * 1000);
  });
  // Only the hint has a deadline. It replaces the first line, never a result the host has delivered.
  const slow = setTimeout(() => { if (ended || shown) return; status.textContent = NOTE.stalled; resize(); }, REQUEST_TIMEOUT_MS);
  // The card is drawn inline only, so it declares no other display mode the host could switch it to.
  request('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'verified-human-approval-card', version: '0.1.0' }, appCapabilities: { availableDisplayModes: ['inline'] } }, false, 0)
    .then((result) => {
      clearTimeout(slow);
      if (ended) return;
      capabilities = result?.hostCapabilities || {};
      hostInfo = result?.hostInfo || {};
      applyTheme(result?.hostContext);
      settle();
      notify('ui/notifications/initialized', {});
      // A result that came first is drawn again, now that the card knows what the host allows.
      if (view) { render(); schedulePoll(); } else if (!shown) status.textContent = NOTE.waiting;
      resize();
    })
    .catch(() => { clearTimeout(slow); settle(); if (ended || shown) return; status.textContent = NOTE.stalled; resize(); });
  setTimeout(settle, SETTLE_MS);
</script>
</body>
</html>
