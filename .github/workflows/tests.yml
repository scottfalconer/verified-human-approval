name: PHP approval checks
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, openssl, sodium, mbstring, dom, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse
      - run: PHP_BIN=php python3 tests/http_smoke.py
  drupal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, openssl, sodium, mbstring, dom, xml, gd, curl, pcntl
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --working-dir=examples/drupal --no-interaction --prefer-dist --no-dev
      - run: php examples/drupal/setup.php
      - run: php packages/drupal/exact_approval/tests/verify.php
      - run: PHP_BIN=php python3 packages/drupal/exact_approval/tests/http_mcp_smoke.py
      - run: python3 -m pip install -r packages/drupal/exact_approval/tests/requirements-http.txt
      - run: python3 packages/drupal/exact_approval/tests/http_ui_smoke.py --php "$(command -v php)" --start-server
