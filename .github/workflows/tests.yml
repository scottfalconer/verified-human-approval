name: Tests
on: [push, pull_request]
jobs:
  php:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The locked set: tests, static analysis and the coding standard.
          - php: '8.3'
            dependencies: locked
          - php: '8.4'
            dependencies: locked
          - php: '8.5'
            dependencies: locked
          # The lowest versions the packages allow, so their lower bounds stay honest.
          - php: '8.3'
            dependencies: lowest
          # Symfony 8, which the bundle's constraints allow.
          - php: '8.4'
            dependencies: symfony-8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, openssl, sodium, mbstring, dom, pcntl
          coverage: none
      # The reference app aliases the SDK-compatible MCP bundle version for its host OAuth bundle's older bound.
      # Keep strict schema/lock validation here; package dependency constraints still get full strict checks below.
      - run: composer validate --strict --no-check-publish --no-check-all
      - run: for manifest in src/*/composer.json; do composer validate --strict --no-check-publish --no-check-lock "$manifest"; done
      - name: Install the locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist
      - name: Install the lowest allowed dependencies
        if: matrix.dependencies == 'lowest'
        # symfony/error-handler before 7.4.22 leaves an exception handler registered after a kernel boots,
        # which PHPUnit reports as risky. It is a test-only concern, so only this job raises it.
        run: |
          composer require --dev --no-update 'symfony/error-handler:^7.4.22'
          composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - name: Install Symfony 8
        if: matrix.dependencies == 'symfony-8'
        run: |
          # The lock is resolved for PHP 8.3; Symfony 8 needs this runner's own PHP 8.4.
          composer config --unset platform.php
          # Decoded as objects, so empty JSON objects such as config.platform stay objects.
          php -r '$c = json_decode(file_get_contents("composer.json")); foreach (["require", "require-dev"] as $s) foreach ($c->$s as $p => $v) if (str_starts_with($p, "symfony/") && str_starts_with($v, "^7.4")) $c->$s->$p = "^8.0"; file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)."\n");'
          composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Show the versions under test
        run: composer show | grep -E '^(symfony/framework-bundle|symfony/mcp-bundle|mcp/sdk|web-auth/webauthn-lib|phpunit/phpunit) '
      # A deprecation fails the run (phpunit.dist.xml), whoever raises it. That holds for the locked set, where a
      # commit decides every version. Where the versions are resolved as the job runs, it is reported and does not
      # fail: an old release or a new one of somebody else's package can raise one that no commit here causes.
      - run: composer test
        if: matrix.dependencies == 'locked'
      - run: composer test -- --do-not-fail-on-deprecation
        if: matrix.dependencies != 'locked'
      - run: composer analyse
        if: matrix.dependencies == 'locked'
      - run: composer cs
        if: matrix.dependencies == 'locked' && matrix.php == '8.3'
      # The approval card's own script, run against a scripted host: no browser and no npm install.
      - uses: actions/setup-node@v4
        if: matrix.dependencies == 'locked' && matrix.php == '8.3'
        with:
          node-version: '22'
      - run: node --test tests/card_lifecycle.mjs
        if: matrix.dependencies == 'locked' && matrix.php == '8.3'
      - run: PHP_BIN=php python3 tests/http_smoke.py
      - run: PHP_BIN=php python3 tests/oauth_http_smoke.py
  consumer:
    # Core, WebAuthn and MCP installed into a separate project, the way a Drupal module or any other host
    # would use them: no monorepo autoloader and no framework bundles. Then the Doctrine storage, and the testing
    # package as a host's own tests would use it. Then what each package archive ships.
    name: Separate consumer, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, openssl, sodium, mbstring, dom
          coverage: none
      - name: Core and WebAuthn
        run: php tests/Package/check-consumer.php webauthn
      - name: Core, WebAuthn and MCP
        run: php tests/Package/check-consumer.php mcp
      - name: Core, WebAuthn and the Doctrine storage
        run: php tests/Package/check-consumer.php doctrine
      - name: Core, WebAuthn and the testing package
        run: php tests/Package/check-consumer.php testing
      - name: Symfony application with all seven packages
        run: php tests/Package/check-symfony-consumer.php
      - name: Package archives
        run: php tests/Package/check-consumer.php archives
  postgresql:
    # The storage contracts, the approval transaction, the schema, the ORM helpers and the publishing example on a
    # PostgreSQL server. Only the PostgreSQL test classes run, and a skipped one fails the job, so a missing server
    # never passes.
    name: Storage on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      VERIFIED_HUMAN_APPROVAL_POSTGRES_URL: pdo-pgsql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, openssl, sodium, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite contract,doctrine,example --filter Postgres --fail-on-skipped
  mysql:
    # The same on MySQL and MariaDB: LONGTEXT for a 256 KiB proposal, the binary no-pad collation, an
    # identical passkey write-back that changes no row, READ COMMITTED and the lock clauses, then the publishing example.
    name: Storage on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      VERIFIED_HUMAN_APPROVAL_MYSQL_URL: pdo-mysql://root:root@127.0.0.1:3306/mysql?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, openssl, sodium, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite contract,doctrine,example --filter Mysql --fail-on-skipped
