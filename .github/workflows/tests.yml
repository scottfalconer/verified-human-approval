name: Tests
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, openssl, sodium, mbstring, dom, pcntl
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: for manifest in src/*/composer.json; do composer validate --strict --no-check-publish --no-check-lock "$manifest"; done
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse
      - run: PHP_BIN=php python3 tests/http_smoke.py
