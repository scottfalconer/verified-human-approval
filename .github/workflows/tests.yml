name: Tests
on: [push, pull_request]
jobs:
  php:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The locked set: tests, static analysis and the coding standard.
          - php: '8.3'
            dependencies: locked
          - php: '8.4'
            dependencies: locked
          # The lowest versions the packages allow, so their lower bounds stay honest.
          - php: '8.3'
            dependencies: lowest
          # Symfony 8, which the bundle's constraints allow.
          - php: '8.4'
            dependencies: symfony-8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, openssl, sodium, mbstring, dom, pcntl
          coverage: none
      # The root requires symfony/mcp-bundle through an inline alias (1.0.0-BETA1 as 0.13.99) because
      # omouren/mcp-oauth-bundle still declares ^0.13. Validate warns that an alias is an exact constraint, so the
      # root skips the constraint warnings (--no-check-all); the packages below are validated in full.
      - run: composer validate --strict --no-check-publish --no-check-all
      - run: for manifest in src/*/composer.json; do composer validate --strict --no-check-publish --no-check-lock "$manifest"; done
      - name: Install the locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist
      - name: Install the lowest allowed dependencies
        if: matrix.dependencies == 'lowest'
        # symfony/error-handler before 7.4.22 leaves an exception handler registered after a kernel boots,
        # which PHPUnit reports as risky. It is a test-only concern, so only this job raises it.
        run: |
          composer require --dev --no-update 'symfony/error-handler:^7.4.22'
          composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - name: Install Symfony 8
        if: matrix.dependencies == 'symfony-8'
        run: |
          # The lock is resolved for PHP 8.3; Symfony 8 needs this runner's own PHP 8.4.
          composer config --unset platform.php
          # Decoded as objects, so empty JSON objects such as config.platform stay objects.
          php -r '$c = json_decode(file_get_contents("composer.json")); foreach (["require", "require-dev"] as $s) foreach ($c->$s as $p => $v) if (str_starts_with($p, "symfony/") && str_starts_with($v, "^7.4")) $c->$s->$p = "^8.0"; file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)."\n");'
          composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Show the versions under test
        run: composer show | grep -E '^(symfony/framework-bundle|symfony/mcp-bundle|mcp/sdk|web-auth/webauthn-lib|phpunit/phpunit) '
      - run: composer test
      - run: composer analyse
        if: matrix.dependencies == 'locked'
      - run: composer cs
        if: matrix.dependencies == 'locked' && matrix.php == '8.3'
      - uses: actions/setup-node@v4
        if: matrix.dependencies == 'locked' && matrix.php == '8.3'
        with:
          node-version: '22'
      - name: Check delayed MCP card responses
        if: matrix.dependencies == 'locked' && matrix.php == '8.3'
        run: node --test tests/card_lifecycle.mjs
      - run: PHP_BIN=php python3 tests/http_smoke.py
  consumer:
    # Core, WebAuthn and MCP installed into a separate project, the way a Drupal module or any other host
    # would use them: no monorepo autoloader and no framework bundles. Then what each package archive ships.
    name: Separate consumer, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, openssl, sodium, mbstring
          coverage: none
      - name: Core and WebAuthn
        run: php tests/Package/check-consumer.php webauthn
      - name: Core, WebAuthn and MCP
        run: php tests/Package/check-consumer.php mcp
      - name: Package archives
        run: php tests/Package/check-consumer.php archives
