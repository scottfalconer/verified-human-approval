exact_approval.settings:
  type: config_object
  label: Exact approval settings
  mapping:
    rules:
      type: sequence
      label: Protected operations
      sequence:
        type: mapping
        mapping:
          operation:
            type: string
            label: Operation
          bundle:
            type: string
            label: Content type
          permissions:
            type: sequence
            label: Native permission bindings
            sequence:
              type: string
    statements:
      type: mapping
      label: Approval statements
      mapping:
        publish:
          type: text
          label: Publish statement
        delete:
          type: text
          label: Delete statement
    lifetime:
      type: integer
      label: Proposal lifetime in seconds
    origin:
      type: string
      label: Fixed browser origin
    rp_id:
      type: string
      label: WebAuthn relying party ID

